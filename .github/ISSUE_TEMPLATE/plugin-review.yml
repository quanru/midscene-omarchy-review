name: Omarchy plugin visual review
description: Request a real Omarchy desktop check with Midscene
title: "[Visual review] "
body:
  - type: markdown
    attributes:
      value: |
        The plugin runs at the exact commit in a disposable GitHub Actions VM.
        You do not need a Midscene API key or your own CI. The result is behavioral evidence, not Marketplace verification or a security audit.
  - type: input
    id: official_issue
    attributes:
      label: Official Marketplace Issue URL
      placeholder: https://github.com/omacom/omarchy-plugin-marketplace/issues/1234
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Plugin repository URL
      description: Public GitHub repository root URL
      placeholder: https://github.com/owner/plugin
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Exact commit SHA
      description: Full 40-character Git commit to test
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: plugin_id
    attributes:
      label: Plugin ID
      description: The id field from manifest.json
      placeholder: owner.plugin-name
    validations:
      required: true
  - type: input
    id: open_method
    attributes:
      label: Open IPC method
      description: Use summon for a panel, overlay, or menu; use the plugin IPC method (often open) for a bar widget
      value: summon
    validations:
      required: true
  - type: textarea
    id: visible_assertion
    attributes:
      label: Expected visible result
      description: One concrete statement a reviewer can judge from desktop pixels
      placeholder: The plugin panel is open and shows its empty state.
    validations:
      required: true
