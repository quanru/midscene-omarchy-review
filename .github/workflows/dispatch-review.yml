name: Run approved Omarchy visual review

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: omarchy-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'approved-to-run' &&
      startsWith(github.event.issue.title, '[Visual review] ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create token limited to the CI worker repository
        id: worker-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_DISPATCH_APP_PRIVATE_KEY }}
          owner: quanru
          repositories: doubao-say
          permission-actions: write
      - name: Validate official submission and run pinned desktop test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_TOKEN: ${{ steps.worker-token.outputs.token }}
        run: node scripts/dispatch-request.mjs
