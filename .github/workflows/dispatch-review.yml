name: Run approved Omarchy visual review

on:
  workflow_call:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: omarchy-review-publish
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      vars.REVIEW_DISPATCH_APP_CLIENT_ID != '' &&
      (github.event_name == 'workflow_call' || github.event.action == 'opened' || github.event.action == 'edited' || github.event.label.name == 'ready-to-run' || github.event.label.name == 'approved-to-run') &&
      startsWith(github.event.issue.title, '[Visual review] ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create token limited to the CI worker repository
        id: worker-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_DISPATCH_APP_PRIVATE_KEY }}
          owner: quanru
          repositories: doubao-say
          permission-actions: write
      - name: Validate official submission and run pinned desktop test
        id: worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_TOKEN: ${{ steps.worker-token.outputs.token }}
        run: node scripts/dispatch-request.mjs
      - name: Download native report from worker run
        env:
          GH_TOKEN: ${{ steps.worker-token.outputs.token }}
          RUN_ID: ${{ steps.worker.outputs.run_id }}
        run: gh run download "$RUN_ID" --repo quanru/doubao-say --name omarchy-midscene-omarchy-plugin-smoke --dir "$RUNNER_TEMP/midscene-report"
      - name: Stage browsable report and preserve history
        env:
          RUN_ID: ${{ steps.worker.outputs.run_id }}
          PLUGIN_REPOSITORY: ${{ steps.worker.outputs.plugin_repository }}
          PLUGIN_SHA: ${{ steps.worker.outputs.plugin_sha }}
        run: |
          node scripts/stage-report.mjs "$RUNNER_TEMP/midscene-report" "$RUN_ID" "$PLUGIN_REPOSITORY" "$PLUGIN_SHA"
          git config user.name quanru
          git config user.email quanruzhuoxiu@gmail.com
          git add docs
          git commit -m "docs(review): publish Omarchy run $RUN_ID"
          git push
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy browsable review history
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Link direct HTML report on request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ steps.worker.outputs.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "[Open the Midscene HTML report directly](https://quanru.github.io/midscene-omarchy-review/reports/${RUN_ID}/). The report covers this pinned CI run only; a maintainer will review the screenshot before posting to the official Issue."
